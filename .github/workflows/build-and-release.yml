name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      # 生成 sdist + wheel (纯 Python)
      - name: Build sdist & wheel
        run: |
          python -m build
          ls -al dist/

      # 生成 zip 包 (供 release 或 artifact 使用)
      - name: Determine version
        id: version
        run: |
          # Slashes have to go. VERSION ends up in an upload-artifact name,
          # which rejects "/" outright ("The artifact name is not valid"), and
          # in the AppImage output filename, where it would silently become a
          # directory component. Every branch following this project's own
          # convention has one -- fix/..., feature/... -- so a manual run on
          # any of them failed at the very last step, after the whole build had
          # already succeeded.
          #
          # Tags and branches were always treated identically here: the two
          # arms of the old if/else were the same line.
          VERSION="${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION"

      # 上传到 PyPI（仅在打 tag 时触发）
      - name: Publish package distributions to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # repository-url: https://test.pypi.org/legacy/
          verbose: true

      # 上传 release 资产（zip + wheel + sdist）
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.whl

      # 非 tag push 的 nightly artifact
      - name: Upload Nightly Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: k230-flash-${{ env.VERSION }}
          path: |
            dist/*.whl

  gui-release:
    strategy:
      # Without this the first platform to fail cancels the other two, and
      # their logs read "The operation was canceled" -- which is how a
      # Linux-only breakage came to look like all three platforms being broken.
      fail-fast: false
      matrix:
        # `label` selects which build step runs and must stay one of
        # ubuntu/windows/macos; `arch` exists only so the two macOS jobs can be
        # told apart in artifact names.
        #
        # macOS is built twice on purpose. macos-14 and later are Apple Silicon
        # only, macos-13 is the last free Intel image, and nothing here builds
        # universal2 binaries -- PyInstaller targets the host architecture. So
        # simply "upgrading" macos-13 to macos-14 would have dropped Intel Macs
        # without the artifact name changing to say so.
        include:
        - os: ubuntu-22.04
          label: ubuntu
          arch: x86_64
          runner: ubuntu-22.04
        - os: windows-2022
          label: windows
          arch: x86_64
          runner: windows-2022
        - os: macos-13
          label: macos
          arch: x86_64
          runner: macos-13
        - os: macos-14
          label: macos
          arch: arm64
          runner: macos-14
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UPX / 7zip (Windows only)
        if: matrix.label == 'windows'
        run: |
          choco install upx -y
          choco install 7zip -y

      - name: Install macOS dependencies
        if: matrix.label == 'macos'
        run: |
          brew update
          brew install libusb


      # Determine version
      - name: Determine version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          # Slashes have to go. VERSION ends up in an upload-artifact name,
          # which rejects "/" outright ("The artifact name is not valid"), and
          # in the AppImage output filename, where it would silently become a
          # directory component. Every branch following this project's own
          # convention has one -- fix/..., feature/... -- so a manual run on
          # any of them failed at the very last step, after the whole build had
          # already succeeded.
          #
          # Tags and branches were always treated identically here: the two
          # arms of the old if/else were the same line.
          VERSION="${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION"

      - name: Build GUI with PyInstaller (Windows)
        if: matrix.label == 'windows'
        env:
          VERSION: ${{ env.VERSION }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          chcp 65001  # 设置控制台为 UTF-8
          # python -m pip, not bare pip: on Windows `pip install --upgrade pip`
          # cannot replace the executable it is running from and logs
          # "ERROR: To modify pip, please run the following command". pwsh does
          # not stop on that, so the upgrade silently never happened while the
          # log carried a red herring for anyone debugging this job.
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          python -m pip install -e .
          cd src/gui
          # Create version.txt file
          echo "$env:VERSION" | Out-File -FilePath "version.txt" -Encoding utf8 -NoNewline
          Write-Host "Created version.txt with version: $env:VERSION"
          python build_windows.py
        shell: pwsh

      - name: Build GUI with PyInstaller (macOS)
        if: matrix.label == 'macos'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          python -m pip install -e .
          cd src/gui
          # Create version.txt file
          echo "$VERSION" > version.txt
          echo "Created version.txt with version: $VERSION"
          python build_macos.py

      - name: Package GUI (Linux with Docker & FUSE)
        if: matrix.label == 'ubuntu'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          # 在主机上创建upload目录并设置权限
          mkdir -p upload
          chmod 777 upload
          
          # 在Docker容器中执行构建
          docker run --rm \
            --privileged \
            --device /dev/fuse \
            --user root \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:22.04 \
            bash -c '
              export DEBIAN_FRONTEND=noninteractive
              export TZ=Etc/UTC
              ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime

              apt-get update
              apt-get install -y \
                software-properties-common \
                wget curl git build-essential \
                libfuse2 fuse \
                libgl1-mesa-dev libvulkan-dev \
                libssl-dev libudev-dev \
                file apt-utils ca-certificates unzip \
                gnupg lsb-release \
                shared-mime-info \
                libusb-1.0-0 \
                libusb-1.0-0-dev \
                libusb-dev \
                libgdk-pixbuf2.0-0 libgdk-pixbuf2.0-bin libgdk-pixbuf2.0-dev \
                libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 \
                libwayland-client0 libwayland-cursor0 libwayland-egl1 libdrm2

              # PyInstaller only bundles a library it can find on the *build*
              # machine, so what ends up in the artefact depends on what is
              # installed here. libxkbcommon0 was missing, so the released
              # bundle referenced it without shipping it and died on a clean
              # system with "ImportError: libxkbcommon.so.0". A local build was
              # fine only because that machine happened to have it already.
              #
              # NOTE: this whole block is inside bash -c SINGLE QUOTES, so an
              # apostrophe anywhere in it -- including in a comment -- closes
              # the string early and the remainder runs on the host runner
              # instead of in the container. That is exactly how this comment
              # broke the build once already.

              # Python: jammy ships 3.10, which is all this needs
              # (requires-python is >=3.9).
              #
              # This used to be ubuntu:20.04 plus python3.11 from the deadsnakes
              # PPA, and it broke the moment deadsnakes stopped publishing for
              # focal after 20.04 went EOL. The PPA still resolved -- apt logged
              # "Hit ... deadsnakes ... focal InRelease" -- it simply no longer
              # carried python3.11, so the build failed with "Unable to locate
              # package python3.11" and then "pyinstaller: command not found".
              # Nothing in this repo changed; the base image rotted underneath.
              #
              # Staying on 20.04 was not an option: its own Python is 3.8 and
              # PySide6 6.8 requires >=3.9. Using the distro Python rather than
              # a PPA also removes a third party that can drop support again.
              #
              # Cost: the AppImage glibc floor moves 2.31 -> 2.35, so it now
              # needs Ubuntu 22.04+ / Debian 12+ rather than 20.04+.
              apt-get install -y python3 python3-venv python3-dev python3-pip
              python3 --version

              # pip & 构建工具
              python3 -m pip install --upgrade pip setuptools wheel

              # PyInstaller only -- PySide6 comes from requirements.txt below, which
              # pins it. Installing it unpinned here meant the GUI was built
              # against whatever PySide6 was current that day rather than the
              # version the project tests against.
              python3 -m pip install pyinstaller

              # python3 -m pip, not bare pip: with the distro Python the bare
              # entry point can resolve to a different interpreter.
              python3 -m pip install -r requirements.txt
              python3 -m pip install -e .

              # Fail loudly here rather than 60 lines later at "dist does not
              # exist", which is how the previous breakage presented.
              python3 -m PyInstaller --version

              wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
              chmod +x /usr/local/bin/appimagetool

              # The runtime that appimagetool embeds by default dlopen()s
              # libfuse.so.2, which Ubuntu has not shipped by default since
              # 22.04 and renamed to libfuse2t64 in 24.04. The result was an
              # AppImage that refused to start on any current distro with
              #     dlopen(): error loading libfuse.so.2
              #     AppImages require FUSE to run.
              # even though nothing was wrong with the application. The
              # type2-runtime build is static-pie linked with fuse3 built in
              # (verified: `not a dynamic executable`, zero references to
              # libfuse.so.2), so it needs nothing installed on the host.
              wget -q https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
                   -O /tmp/appimage-runtime
              chmod +x /tmp/appimage-runtime

              # 验证和确保upload目录存在
              echo "检查upload目录状态:"
              ls -la /workspace/ | grep upload || echo "upload目录不存在"
              
              # 在容器内确保upload目录存在并有正确权限
              mkdir -p /workspace/upload
              chmod 777 /workspace/upload
              echo "容器内upload目录创建完成:"
              ls -la /workspace/upload

              # 构建 GUI
              cd src/gui
              echo "当前工作目录: $(pwd)"
              
              # Create version.txt file
              echo "Creating version.txt file..."
              if [ -n "'${{ env.VERSION }}'" ]; then
                echo "'${{ env.VERSION }}'" > version.txt
                echo "Created version.txt with version: '${{ env.VERSION }}'"
              else
                echo "dev" > version.txt
                echo "Created version.txt with default version: dev"
              fi
              
              python3 -m PyInstaller --clean -y k230_flash_gui.spec

              # 验证PyInstaller构建输出
              if [ ! -d "dist/k230_flash_gui" ]; then
                echo "错误: PyInstaller构建失败，dist目录不存在"
                exit 1
              fi
              echo "PyInstaller构建成功，输出内容:"
              ls -la dist/k230_flash_gui/ | head -10

              # 创建 AppDir
              APPDIR=$(pwd)/AppDir
              rm -rf $APPDIR
              mkdir -p $APPDIR/usr/bin
              cp -r dist/k230_flash_gui/* $APPDIR/usr/bin/
              
              # 检查并复制AppDir配置文件
              if [ -d "package/AppDir" ]; then
                cp -r package/AppDir/* $APPDIR/
                echo "复制package/AppDir配置文件成功"
              else
                echo "警告: package/AppDir目录不存在"
              fi
              
              mkdir -p $APPDIR/usr/share/pixmaps
              if [ -d "assets" ]; then
                cp -r assets $APPDIR/usr/share/
                echo "复制assets目录成功"
              else
                echo "警告: assets目录不存在"
              fi
              
              # 配置gdk-pixbuf
              mkdir -p $APPDIR/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders
              cp -r /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders/* $APPDIR/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders/
              cp /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders $APPDIR/usr/bin/
              $APPDIR/usr/bin/gdk-pixbuf-query-loaders > $APPDIR/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache

              # 验证AppDir结构
              echo "AppDir结构验证:"
              echo "AppDir根目录:"
              ls -la $APPDIR/
              echo "可执行文件:"
              ls -la $APPDIR/usr/bin/k230_flash_gui
              
              # 设置AppImage输出路径
              OUTPUT_PATH="/workspace/upload/k230_flash_gui-ubuntu-${{ env.VERSION }}.AppImage"
              echo "AppImage输出路径: $OUTPUT_PATH"
              
              # 再次验证输出目录
              echo "验证输出目录:"
              ls -la /workspace/upload/
              
              # 打包 AppImage
              echo "开始打包AppImage..."
              if ARCH=x86_64 appimagetool --no-appstream --runtime-file /tmp/appimage-runtime $APPDIR "$OUTPUT_PATH"; then
                echo "AppImage创建成功!"
                ls -la "$OUTPUT_PATH"
              else
                echo "AppImage创建失败，退出码: $?"
                # 显示更多调试信息
                echo "AppDir内容检查:"
                find $APPDIR -type f | head -20
                echo "输出目录检查:"
                ls -la /workspace/upload/
                exit 1
              fi
            '

      # Actually start the thing on distros we do not build on. The AppImage
      # shipped broken on every current Ubuntu for a while -- it needed
      # libfuse2, which 22.04 stopped installing by default and 24.04 renamed --
      # and nothing in CI noticed, because building an artefact says nothing
      # about whether it runs. If the AppImage ever fails here and it is not
      # obvious whether the runtime or the bundle is at fault,
      # `./app.AppImage --appimage-extract` separates the two.
      - name: Smoke-test the Linux bundles on other distros
        if: matrix.label == 'ubuntu'
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "::group::$image"
            # --device /dev/fuse models a normal desktop; the point of the
            # static runtime is that no libfuse2 *package* is needed, not that
            # FUSE itself is gone. Deliberately installing nothing beyond the
            # bare X-less Qt dependencies -- if the bundle needs more than this,
            # that is what we want to find out here rather than from a user.
            docker run --rm --privileged --device /dev/fuse \
              -v "${{ github.workspace }}/upload:/upload:ro" \
              -e QT_QPA_PLATFORM=offscreen \
              "$image" bash -euo pipefail -c '
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq >/dev/null
                # Model a desktop, not a bare container. These are libraries any
                # graphical install already has, and several of them (libGL,
                # libEGL, libdrm) must come from the host anyway because they
                # are coupled to the graphics driver and must never be bundled.
                # fuse3 is here because the static AppImage runtime still needs
                # the fusermount3 *binary*; what it no longer needs is libfuse2,
                # and that absence is asserted below -- it is the actual
                # regression being guarded.
                apt-get install -y -qq --no-install-recommends \
                  fuse3 libglib2.0-0 libgl1 libegl1 libdrm2 libdbus-1-3 fontconfig \
                  libxkbcommon0 libxcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
                  >/dev/null
                if dpkg -l | grep -qE "^ii +libfuse2"; then
                  echo "FAIL: libfuse2 is installed, so this proves nothing"; exit 1
                fi
                echo "libfuse2 absent as intended; fusermount3=$(command -v fusermount3 || echo MISSING)"

                work=$(mktemp -d); cd "$work"
                cp /upload/*.AppImage ./app.AppImage
                chmod +x app.AppImage

                check() {  # $1 = label, $2... = command
                  local label=$1; shift
                  local rc=0
                  timeout 25 "$@" > out.log 2>&1 || rc=$?
                  # A GUI that is still alive when timeout fires (124) is the
                  # success case; anything else means it exited on its own.
                  if ! grep -q "主窗口已显示" out.log; then
                    echo "FAIL [$label]: never reached the main window (rc=$rc)"
                    sed -n 1,40p out.log
                    return 1
                  fi
                  echo "OK   [$label] (rc=$rc)"
                }

                check AppImage ./app.AppImage
              '
            echo "::endgroup::"
          done

      # 上传 release
      - name: Upload GUI Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*

      - name: Upload GUI Nightly Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: k230_flash_gui-${{ matrix.label }}-${{ matrix.arch }}-${{ env.VERSION }}
          path: upload/*
